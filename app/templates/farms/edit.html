{% extends "base.html" %}
{% block title %}Edit Farm - {{ farm.farm_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold text-success mb-1">Edit Farm: {{ farm.farm_name }}</h3>
        <p class="text-muted small mb-0">Update farm identification, operational type, and management status</p>
    </div>
    <a href="{{ url_for('farms.detail', id=farm.id) }}" class="btn btn-outline-secondary rounded-pill px-3 py-1">
        <i class="bi bi-arrow-left me-1"></i> Back to Profile
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="glass-card p-4 p-md-5">
            <form method="POST" action="{{ url_for('farms.edit', id=farm.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Farm Name *</label>
                    <input type="text" name="farm_name" class="form-control" value="{{ farm.farm_name }}" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Farm Type</label>
                        <select name="farm_type" class="form-select">
                            <option value="Dairy" {% if farm.farm_type == 'Dairy' %}selected{% endif %}>Dairy Farm</option>
                            <option value="Pastoral" {% if farm.farm_type == 'Pastoral' %}selected{% endif %}>Pastoral / Grazing</option>
                            <option value="Mixed" {% if farm.farm_type == 'Mixed' %}selected{% endif %}>Mixed Livestock Farming</option>
                            <option value="Breeding" {% if farm.farm_type == 'Breeding' %}selected{% endif %}>Pedigree Breeding Center</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Location / District</label>
                        <input type="text" name="location" class="form-control" value="{{ farm.location or '' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="active" {% if farm.status == 'active' %}selected{% endif %}>Active</option>
                        <option value="inactive" {% if farm.status == 'inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('farms.detail', id=farm.id) }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 rounded-pill fw-semibold shadow-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
