{% extends "base.html" %}
{% block title %}Create Farm Profile - Livestock Health Monitoring{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold text-success mb-1">Create Farm Profile</h3>
        <p class="text-muted small mb-0">Establish a new livestock production location or dairy enterprise</p>
    </div>
    <a href="{{ url_for('farms.index') }}" class="btn btn-outline-secondary rounded-pill px-3 py-1">
        <i class="bi bi-arrow-left me-1"></i> Back to Farms
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="glass-card p-4 p-md-5">
            <form method="POST" action="{{ url_for('farms.create') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Farm / Facility Name *</label>
                    <input type="text" name="farm_name" class="form-control" placeholder="e.g. Green Pastures Dairy Farm" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Production Type</label>
                        <select name="farm_type" class="form-select">
                            <option value="Dairy" selected>Dairy Farm</option>
                            <option value="Pastoral">Pastoral / Grazing</option>
                            <option value="Mixed">Mixed Livestock Farming</option>
                            <option value="Breeding">Pedigree Breeding Center</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Geographical Location / District</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g. Karnal, Haryana, India">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('farms.index') }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 rounded-pill fw-semibold shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Create Farm
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
