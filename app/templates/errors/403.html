{% extends "base.html" %}
{% block title %}Error 403 - Access Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="glass-card p-5">
            <i class="bi bi-shield-x text-danger" style="font-size: 4rem;"></i>
            <h2 class="mt-3 fw-bold">Access Forbidden</h2>
            <p class="text-muted">You do not have the required permissions or farm-level authorization to access this record.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary px-4 rounded-pill">
                <i class="bi bi-arrow-left me-2"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
