{% extends "base.html" %}
{% block title %}Error 500 - Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="glass-card p-5">
            <i class="bi bi-server text-secondary" style="font-size: 4rem;"></i>
            <h2 class="mt-3 fw-bold">Internal Server Error</h2>
            <p class="text-muted">An unexpected server error occurred while processing your request. The issue has been logged for system administrators.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-success px-4 rounded-pill">
                <i class="bi bi-house me-2"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
