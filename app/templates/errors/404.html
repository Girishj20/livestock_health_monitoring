{% extends "base.html" %}
{% block title %}Error 404 - Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="glass-card p-5">
            <i class="bi bi-compass text-warning" style="font-size: 4rem;"></i>
            <h2 class="mt-3 fw-bold">Page Not Found</h2>
            <p class="text-muted">The requested page or livestock record could not be found or has been relocated.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-success px-4 rounded-pill">
                <i class="bi bi-house-door me-2"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
