{% extends "base.html" %}
{% block title %}Error 400 - Bad Request{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="glass-card p-5">
            <i class="bi bi-exclamation-octagon text-danger" style="font-size: 4rem;"></i>
            <h2 class="mt-3 fw-bold">Bad Request</h2>
            <p class="text-muted">{{ error.description if error and error.description else 'The request could not be processed due to invalid parameters or an expired security token.' }}</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-success px-4 rounded-pill">
                <i class="bi bi-arrow-left me-2"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
