{% extends "base.html" %}
{% block title %}Edit {{ animal.animal_tag }} - Livestock Health Monitoring{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold text-success mb-1">Edit Animal: {{ animal.animal_tag }}</h3>
        <p class="text-muted small mb-0">Update profile parameters, management status, and health notes</p>
    </div>
    <a href="{{ url_for('animals.detail', id=animal.id) }}" class="btn btn-outline-secondary rounded-pill px-3 py-1">
        <i class="bi bi-arrow-left me-1"></i> Back to Profile
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="glass-card p-4 p-md-5">
            <form method="POST" action="{{ url_for('animals.edit', id=animal.id) }}" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Animal Tag (Locked)</label>
                        <input type="text" class="form-control bg-light" value="{{ animal.animal_tag }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Species (Locked)</label>
                        <input type="text" class="form-control bg-light" value="{{ animal.species }}" readonly>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Animal Name</label>
                        <input type="text" name="animal_name" class="form-control" value="{{ animal.animal_name or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Breed</label>
                        <input type="text" name="breed" class="form-control" value="{{ animal.breed or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Sex</label>
                        <select name="sex" class="form-select">
                            <option value="Female" {% if animal.sex == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Male" {% if animal.sex == 'Male' %}selected{% endif %}>Male</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Estimated Age (Months)</label>
                        <input type="number" name="estimated_age_months" class="form-control" value="{{ animal.estimated_age_months or '' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Weight (kg)</label>
                        <input type="number" step="0.1" name="weight_kg" class="form-control" value="{{ animal.weight_kg or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Production Purpose</label>
                        <select name="production_purpose" class="form-select">
                            <option value="Dairy" {% if animal.production_purpose == 'Dairy' %}selected{% endif %}>Dairy</option>
                            <option value="Meat" {% if animal.production_purpose == 'Meat' %}selected{% endif %}>Meat</option>
                            <option value="Breeding" {% if animal.production_purpose == 'Breeding' %}selected{% endif %}>Breeding</option>
                            <option value="Wool" {% if animal.production_purpose == 'Wool' %}selected{% endif %}>Wool</option>
                            <option value="Multi-purpose" {% if animal.production_purpose == 'Multi-purpose' %}selected{% endif %}>Multi-purpose</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Management Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" {% if animal.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Sick" {% if animal.status == 'Sick' %}selected{% endif %}>Sick / Quarantine</option>
                            <option value="Sold" {% if animal.status == 'Sold' %}selected{% endif %}>Sold</option>
                            <option value="Deceased" {% if animal.status == 'Deceased' %}selected{% endif %}>Deceased</option>
                            <option value="Archived" {% if animal.status == 'Archived' %}selected{% endif %}>Archived</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Update Photograph (Optional)</label>
                    <input type="file" name="image" class="form-control" accept="image/png, image/jpeg, image/webp">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control" rows="3">{{ animal.notes or '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('animals.detail', id=animal.id) }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 rounded-pill fw-semibold shadow-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
